<link id="favicon" rel="icon" type="image/png" href="1.png">

<script>
    const favicon = document.getElementById("favicon");

    const normalFrames = ["1.png", "2.png", "3.png", "4.png"];
    const fastFrames = ["5.png", "6.png", "7.png", "8.png", "7.png", "6.png", "5.png"];

    function wait(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function animateFavicon() {
        while (true) {

            // 1 → 2 → 3 → 4
            for (const image of normalFrames) {
                favicon.href = image;
                await wait(800);
            }

            // 5 → 6 → 7 → 8 → 7 → 6 → 5
            for (const image of fastFrames) {
                favicon.href = image;
                await wait(250);
            }
        }
    }

    animateFavicon();
</script>
</script>
    
    <style>
