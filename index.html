
<!DOCTYPE html>

<head>

    <style>
        * {

            align-items: center;
            justify-content: center;

            background: #050505;

        }

        .container {
            width: 90%;
            max-width: 650px;

        }

            color: #d0d0d0;

        .links {
            margin-top: 22px;
            display: flex;
            justify-content: center;

        }

        .links a {

            color: #888;
            background: #090909;
            border: 1px solid #1c1c1c;

            font-size: 12px;
            text-decoration: none;

            transition: 0.2s ease;
        }

        .links a:hover {
            color: #fff;
            background: #0d0d0d;
            border-color: #333;
        }
